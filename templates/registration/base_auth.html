{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puntero · {% block title %}Cuenta{% endblock %}</title>
  <meta
    name="description"
    content="El juego de pronósticos de fútbol para competir con tus amigos."
  >

  <!-- App CSS -->
  <link rel="stylesheet" href="{% static 'app.css' %}">

  <!-- Minimal auth-only tweaks (keine Farben überschreiben) -->
  <style>
    .auth-wrap{
      min-height: calc(100vh - 24px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 16px;
    }
    .auth-card{
      width:100%;
      max-width: 520px;
    }
    .links{
      margin-top: 12px;
      text-align:center;
    }
    /* Falls deine Form Widgets keine Klassen haben, greifen wir über .field input etc. aus app.css */
  </style>
</head>

<body class="auth-body">
  <div class="auth-wrap">
    <div class="card auth-card">
      <header class="auth-header auth-header--puntero">
        <a href="{% url 'root' %}" class="auth-logo">
          Puntero
        </a>
        <p class="auth-subtitle">
          El juego de pronósticos de fútbol para competir con tus amigos.
        </p>
      </header>
      {% block content %}{% endblock %}
    </div>
  </div>

  {% include "tipping/_legal_footer.html" %}
</body>
</html>
